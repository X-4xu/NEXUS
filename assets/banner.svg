<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#090E1A" />
      <stop offset="100%" stop-color="#04060C" />
    </linearGradient>

    <linearGradient id="nGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="chrome3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="b" />
      <feComposite in="SourceGraphic" in2="b" operator="over" />
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg3)" />

  <!-- Neural Mesh & Particle Lines in Background -->
  <g opacity="0.15" stroke="#3B82F6" stroke-width="1">
    <line x1="640" y1="90" x2="520" y2="210" />
    <line x1="640" y1="90" x2="760" y2="210" />
    <line x1="520" y1="210" x2="520" y2="310" />
    <line x1="760" y1="210" x2="760" y2="310" />
    <line x1="520" y1="310" x2="640" y2="210" />
    <line x1="760" y1="310" x2="640" y2="210" />
    <circle cx="640" cy="90" r="4" fill="#06B6D4" />
    <circle cx="520" cy="210" r="4" fill="#3B82F6" />
    <circle cx="760" cy="210" r="4" fill="#8B5CF6" />
    <circle cx="520" cy="310" r="4" fill="#3B82F6" />
    <circle cx="760" cy="310" r="4" fill="#8B5CF6" />
    <circle cx="640" cy="210" r="5" fill="#FFFFFF" />
  </g>

  <!-- Central Emblem: Geometric Nexus 'N' Core -->
  <g transform="translate(640, 200)">
    <!-- Glowing 3D Prism N -->
    <path d="M-60,-90 L-25,-90 L25,40 L25,-90 L60,-90 L60,90 L25,90 L-25,-40 L-25,90 L-60,90 Z" 
          fill="url(#nGrad)" filter="url(#glow3)" opacity="0.8" />
    <path d="M-60,-90 L-25,-90 L25,40 L25,-90 L60,-90 L60,90 L25,90 L-25,-40 L-25,90 L-60,90 Z" 
          fill="#0F172A" stroke="url(#nGrad)" stroke-width="3" />

    <!-- Core Highlights -->
    <line x1="-25" y1="-40" x2="25" y2="40" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="0" cy="0" r="8" fill="#06B6D4" filter="url(#glow3)" />
  </g>

  <!-- Title & Subtitle -->
  <text x="640" y="390" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="64" 
        font-weight="900" 
        letter-spacing="16" 
        fill="url(#chrome3)" 
        text-anchor="middle">
    NEXUS
  </text>

  <rect x="520" y="415" width="240" height="3" rx="1.5" fill="url(#nGrad)" filter="url(#glow3)" />

  <text x="640" y="455" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="20" 
        font-weight="600" 
        letter-spacing="2" 
        fill="#94A3B8" 
        text-anchor="middle">
    Network Engine Xtreme &amp; Unified Windows Suite
  </text>

  <!-- Tagline -->
  <g transform="translate(640, 505)">
    <rect x="-220" y="-14" width="440" height="28" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <text x="0" y="5" 
          font-family="ui-monospace, SFMono-Regular, monospace" 
          font-size="12" 
          font-weight="700" 
          fill="#06B6D4" 
          text-anchor="middle">
      ZERO LATENCY &bull; RAM PURGE &bull; 100% SAFE
    </text>
  </g>
</svg>
